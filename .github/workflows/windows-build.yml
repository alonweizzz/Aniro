name: Build Aniro for Windows
on:
  push:
    branches: [main]
  workflow_dispatch:
jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install dependencies
        run: python -m pip install -r requirements.txt pyinstaller
      - name: Generate Windows icon
        run: python make_icon.py
      - name: Build EXE with Aniro branding
        run: python -m PyInstaller --noconfirm --clean --onefile --windowed --name Aniro --icon Aniro.ico --add-data "logo.png;." app.py
      - uses: actions/upload-artifact@v4
        with:
          name: Aniro-Windows-EXE
          path: dist/Aniro.exe
